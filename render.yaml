# Blueprint do Render: cria o servico web a partir do Dockerfile.
services:
  - type: web
    name: caixa-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/me
    envVars:
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_CAIXA_PASSWORD
        sync: false
      # Endereço do banco MongoDB Atlas (veja o PUBLICAR.md). Sem ele o sistema usa o SQLite do servidor, que se apaga ao reiniciar.
      - key: MONGODB_URI
        sync: false
